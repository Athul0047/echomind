[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echomind"
version = "0.1.0"
description = "Local multi-label audio event detection with EfficientAT DyMN."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14,<3",
    "transformers>=5.20,<6",
    "numpy>=2.5,<3",
    "soundfile>=0.14,<1",
    "scipy>=1.18,<2",
    "torchaudio>=2.11,<3",
    "torchvision>=0.29.1,<0.30",
    "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "websockets>=13.1,<16",
]
test = [
    "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"echomind._efficientat" = ["metadata/*.csv", "LICENSE", "SOURCE.txt"]
